name: Build MD Print APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release.jks
          else
            echo "No KEYSTORE_BASE64 secret - generating a throwaway key (APK installs fine, but updates need the same key)"
            keytool -genkeypair -v -keystore app/release.jks -storepass mdprint123 -keypass mdprint123 \
              -alias mdprint -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MD Print, O=MD, C=US"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'mdprint123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'mdprint' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'mdprint123' }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MD-Print.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MD-Print-apk
          path: MD-Print.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MD-Print.apk
          generate_release_notes: true
